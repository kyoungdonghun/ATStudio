# Copy this file to `application-local.yml` at the repository root.
# The base application config imports that gitignored file automatically.
#
# Generate a local-only JWT secret before first run, for example in PowerShell:
# [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/atstudio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&createDatabaseIfNotExist=true
    username: REPLACE_WITH_LOCAL_DB_USER
    password: REPLACE_WITH_LOCAL_DB_PASSWORD

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

jwt:
  secret: REPLACE_WITH_BASE64_32_BYTE_SECRET
  expiration: 3600000
  refresh-expiration: 1209600000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8080

oauth2:
  google:
    redirect-uri: http://localhost:5173/social-login/google
  kakao:
    redirect-uri: http://localhost:5173/social-login/kakao
  naver:
    redirect-uri: http://localhost:5173/social-login/naver

app:
  auth:
    password-login:
      enabled: true
  bootstrap:
    test-users:
      enabled: true
      default-password: ${APP_BOOTSTRAP_TEST_USERS_DEFAULT_PASSWORD:}
  mail:
    base-url: http://localhost:5173
  payment:
    # Local default is MOCK. Use TOSS only when actively testing Toss Payments.
    # Keep frontend, CORS, and Toss redirect URLs on the same localhost origin.
    # Avoid http://127.0.0.1:5173 unless CORS_ALLOWED_ORIGINS also includes it.
    provider: MOCK
    toss:
      client-key: REPLACE_WITH_TOSS_TEST_CLIENT_KEY
      secret-key: REPLACE_WITH_TOSS_TEST_SECRET_KEY
      success-url: http://localhost:5173/subscriptions/payment/success
      fail-url: http://localhost:5173/subscriptions/payment/fail
      confirm-url: https://api.tosspayments.com/v1/payments/confirm
    billing:
      # Generate a local-only 32+ byte random secret. Never commit the real local value.
      encryption-secret: REPLACE_WITH_PAYMENT_BILLING_KEY_ENCRYPTION_SECRET
      auth-success-url: http://localhost:5173/subscriptions/checkout/success
      auth-fail-url: http://localhost:5173/subscriptions/checkout/fail
      issue-url: https://api.tosspayments.com/v1/billing/authorizations/issue
      charge-url: https://api.tosspayments.com/v1/billing/{billingKey}
      delete-url: https://api.tosspayments.com/v1/billing/{billingKey}
      connect-timeout-millis: 3000
      # Toss automatic billing approval can take up to 60 seconds.
      read-timeout-millis: 60000
  security:
    rate-limit:
      enabled: true
      login:
        limit: 30
        window-seconds: 60
      forgot-password:
        limit: 10
        window-seconds: 900
      reset-password:
        limit: 10
        window-seconds: 900
      refresh:
        limit: 60
        window-seconds: 60

# When app.bootstrap.test-users.enabled=true, these non-prod QA accounts are created/reset on boot:
# - qa.admin@atstudio.local      (ADMIN, no subscription)
# - qa.user@atstudio.local       (USER, no subscription)
# - qa.subscriber@atstudio.local (USER, active DELUXE)
# - qa.grace@atstudio.local      (USER, CANCELLED grace-period subscription)
# - qa.business@atstudio.local   (BUSINESS USER, approved certification, active PREMIUM)
