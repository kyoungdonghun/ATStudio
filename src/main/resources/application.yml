spring:
  application:
    name: ATStudio

  config:
    import: optional:file:./application-local.yml

  # 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/atstudio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # Thymeleaf 템플릿 엔진 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # 이메일 발송 설정 (개발: localhost:1025 / 프로덕션: 실제 SMTP)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 60MB

server:
  forward-headers-strategy: none

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8080}

# OAuth2 소셜 로그인 설정
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/social-login/google}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/social-login/kakao}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:5173/social-login/naver}

# Swagger/OpenAPI 설정 (SEC-15: 프로덕션에서는 SWAGGER_ENABLED=false 설정)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# 파일 저장소 설정
app:
  acceptance:
    enabled: ${APP_ACCEPTANCE_ENABLED:false}
    public-base-url: ${APP_PUBLIC_BASE_URL:}
  auth:
    password-login:
      enabled: ${APP_AUTH_PASSWORD_LOGIN_ENABLED:true}
  storage:
    base-path: uploads
    public-path: ${APP_STORAGE_PUBLIC_PATH:${app.storage.base-path:uploads}}
    private-path: ${APP_STORAGE_PRIVATE_PATH:private-uploads}
    recovery:
      batch-size: ${APP_STORAGE_RECOVERY_BATCH_SIZE:50}
      max-attempts: ${APP_STORAGE_RECOVERY_MAX_ATTEMPTS:8}
      stale-seconds: ${APP_STORAGE_RECOVERY_STALE_SECONDS:300}
      claim-seconds: ${APP_STORAGE_RECOVERY_CLAIM_SECONDS:120}
      interval-ms: ${APP_STORAGE_RECOVERY_INTERVAL_MS:60000}
  bootstrap:
    test-users:
      enabled: ${APP_BOOTSTRAP_TEST_USERS_ENABLED:false}
      default-password: ${APP_BOOTSTRAP_TEST_USERS_DEFAULT_PASSWORD:}
  mail:
    from: ${MAIL_FROM:noreply@atstudio.com}
    base-url: ${APP_BASE_URL:http://localhost:5173}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:MOCK}
    toss:
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
      success-url: ${TOSS_SUCCESS_URL:http://localhost:5173/subscriptions/payment/success}
      fail-url: ${TOSS_FAIL_URL:http://localhost:5173/subscriptions/payment/fail}
      confirm-url: ${TOSS_CONFIRM_URL:https://api.tosspayments.com/v1/payments/confirm}
      cancel-url: ${TOSS_CANCEL_URL:https://api.tosspayments.com/v1/payments/{paymentKey}/cancel}
      connect-timeout-millis: ${TOSS_CONNECT_TIMEOUT_MILLIS:3000}
      read-timeout-millis: ${TOSS_READ_TIMEOUT_MILLIS:10000}
    billing:
      encryption-secret: ${PAYMENT_BILLING_KEY_ENCRYPTION_SECRET:}
      auth-success-url: ${TOSS_BILLING_AUTH_SUCCESS_URL:http://localhost:5173/subscriptions/checkout/success}
      auth-fail-url: ${TOSS_BILLING_AUTH_FAIL_URL:http://localhost:5173/subscriptions/checkout/fail}
      issue-url: ${TOSS_BILLING_ISSUE_URL:https://api.tosspayments.com/v1/billing/authorizations/issue}
      charge-url: ${TOSS_BILLING_CHARGE_URL:https://api.tosspayments.com/v1/billing/{billingKey}}
      delete-url: ${TOSS_BILLING_DELETE_URL:https://api.tosspayments.com/v1/billing/{billingKey}}
      payment-lookup-by-order-id-url: ${TOSS_PAYMENT_LOOKUP_BY_ORDER_ID_URL:https://api.tosspayments.com/v1/payments/orders/{orderId}}
      connect-timeout-millis: ${TOSS_BILLING_CONNECT_TIMEOUT_MILLIS:3000}
      read-timeout-millis: ${TOSS_BILLING_READ_TIMEOUT_MILLIS:60000}
    operations:
      reconciliation-notification-enabled: ${PAYMENT_RECONCILIATION_NOTIFICATION_ENABLED:false}
      operator-email: ${PAYMENT_OPERATIONS_OPERATOR_EMAIL:}
  security:
    trusted-client-identity:
      enabled: ${APP_SECURITY_TRUSTED_CLIENT_IDENTITY_ENABLED:false}
      trusted-proxy-addresses: ${APP_SECURITY_TRUSTED_PROXY_ADDRESSES:127.0.0.1,::1}
    rate-limit:
      enabled: ${APP_SECURITY_RATE_LIMIT_ENABLED:true}
      login:
        limit: ${APP_SECURITY_RATE_LIMIT_LOGIN_LIMIT:10}
        window-seconds: ${APP_SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      forgot-password:
        limit: ${APP_SECURITY_RATE_LIMIT_FORGOT_PASSWORD_LIMIT:5}
        window-seconds: ${APP_SECURITY_RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:900}
      reset-password:
        limit: ${APP_SECURITY_RATE_LIMIT_RESET_PASSWORD_LIMIT:5}
        window-seconds: ${APP_SECURITY_RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}
      refresh:
        limit: ${APP_SECURITY_RATE_LIMIT_REFRESH_LIMIT:30}
        window-seconds: ${APP_SECURITY_RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}

# 로깅 설정
logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:warn}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_BINDER:warn}
