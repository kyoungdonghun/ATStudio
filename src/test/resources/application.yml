spring:
  sql:
    init:
      mode: never   # schema.sql은 MySQL 전용. H2 테스트에서는 Hibernate가 Entity 기반으로 스키마 생성
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# JWT 테스트용 설정 (main application.yml이 test classpath에서 대체되므로 명시 필요)
jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1hdHN0dWRpby10ZXN0aW5nLW9ubHktMjAyNg==
  expiration: 3600000
  refresh-expiration: 1209600000

cors:
  allowed-origins: http://localhost:3000,http://localhost:8080

oauth2:
  google:
    client-id:
    client-secret:
    redirect-uri: http://localhost:8080/oauth2/callback/google
  kakao:
    client-id:
    client-secret:
    redirect-uri: http://localhost:8080/oauth2/callback/kakao
  naver:
    client-id:
    client-secret:
    redirect-uri: http://localhost:8080/oauth2/callback/naver
