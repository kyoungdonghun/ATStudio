# WI-20261011-ATS-001. New nginx.service drop-in, never the application unit.
[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/nginx -t -q -c /etc/nginx/tls-quarantine/nginx.conf
ExecStart=
ExecStart=/usr/sbin/nginx -c /etc/nginx/tls-quarantine/nginx.conf -g 'daemon on; master_process on;'
ExecReload=
ExecReload=/usr/sbin/nginx -t -q -c /etc/nginx/tls-quarantine/nginx.conf
ExecReload=/usr/sbin/nginx -c /etc/nginx/tls-quarantine/nginx.conf -g 'daemon on; master_process on;' -s reload
